name: Windows Preview
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-preview]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BANDSTAND_DATA_DIR: '${{ runner.temp }}\bandstand-test-data'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-windows.txt
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: JavaScript tests
        shell: bash
        run: node --test tests/*.cjs
      - name: Build and smoke-test bundled runtime
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bandstand-windows-x64-preview
          path: |
            release/Bandstand-windows-x64-preview.zip
            release/Bandstand-windows-x64-preview.zip.sha256
          if-no-files-found: error
          retention-days: 14
